<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <meta name="description" content="A focused Pomodoro timer with a daily task checklist and session tracking.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffa270'/%3E%3Cstop offset='1' stop-color='%23ff4d8d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='38' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0b10;
      --text: #eef0f6;
      --muted: #8a90a2;
      --faint: #5f6579;
      --border: rgba(255, 255, 255, 0.07);
      --track: #1c2030;
      --accent: #ff6b5e;
      --accent-soft: #ffa270;
      --accent-alt: #ff4d8d;
      color-scheme: dark;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 600px at 15% -5%, rgba(255, 107, 94, 0.10), transparent 60%),
        radial-gradient(800px 600px at 100% 0%, rgba(124, 92, 255, 0.10), transparent 55%),
        radial-gradient(700px 500px at 50% 110%, rgba(255, 77, 141, 0.05), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: rgba(255, 107, 94, 0.3);
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .brand-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent-alt));
      box-shadow: 0 0 18px rgba(255, 107, 94, 0.55);
    }

    .date {
      font-size: 13px;
      color: var(--muted);
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 20px;
      align-items: stretch;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 28px;
      box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
    }

    /* ---------- Timer ---------- */

    .timer-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      overflow: hidden;
      transition: box-shadow 0.4s ease;
    }

    .timer-card::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 440px;
      height: 440px;
      transform: translate(-50%, -52%);
      background: radial-gradient(circle, rgba(255, 107, 94, 0.14), transparent 62%);
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .timer-card.complete::before {
      opacity: 1;
      animation: glowPulse 0.9s ease;
    }

    .timer-card.complete {
      box-shadow: 0 0 0 1px rgba(255, 107, 94, 0.28), 0 24px 70px -20px rgba(255, 107, 94, 0.3);
    }

    @keyframes glowPulse {
      0% { transform: translate(-50%, -52%) scale(1); }
      45% { transform: translate(-50%, -52%) scale(1.12); }
      100% { transform: translate(-50%, -52%) scale(1); }
    }

    .mode-label {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mode-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .timer-wrap {
      position: relative;
      width: min(320px, 74vw);
      aspect-ratio: 1;
      margin: 18px 0 8px;
    }

    .ring {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ring-track {
      fill: none;
      stroke: var(--track);
      stroke-width: 10;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 10;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(255, 107, 94, 0.25));
      transition: stroke-dashoffset 0.25s linear;
    }

    .timer-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #time {
      font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(52px, 11vw, 66px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }

    .timer-card.complete #time {
      color: var(--accent-soft);
    }

    .time-caption {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .controls {
      position: relative;
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      font: inherit;
      font-size: 14.5px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:focus-visible {
      outline: 2px solid #ffb39d;
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-start {
      min-width: 148px;
      padding: 14px 32px;
      color: #1a0d09;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent) 55%, var(--accent-alt));
      box-shadow: 0 10px 30px -8px rgba(255, 90, 110, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-start:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px -8px rgba(255, 90, 110, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-start.is-running {
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: none;
    }

    .btn-start.is-running:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-reset {
      padding: 14px 26px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }

    .btn-reset:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
    }

    .hint {
      position: relative;
      margin-top: 16px;
      font-size: 12px;
      color: var(--faint);
    }

    .hint kbd {
      font-family: inherit;
      font-size: 11px;
      padding: 2px 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      color: #9aa0b4;
    }

    /* ---------- Sessions ---------- */

    .stat-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 26px;
    }

    .stat-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat-value-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 6px;
    }

    .stat-number {
      display: inline-block;
      font-family: "Space Grotesk", Inter, ui-sans-serif, sans-serif;
      font-size: 38px;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-suffix {
      font-size: 12.5px;
      color: var(--muted);
    }

    .dot-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      background: rgba(9, 10, 15, 0.45);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #262b3a;
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    .dot.filled {
      background: linear-gradient(135deg, var(--accent-soft), var(--accent-alt));
      box-shadow: 0 0 10px rgba(255, 107, 94, 0.5);
    }

    .pop {
      animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.4);
    }

    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); color: var(--accent-soft); }
      100% { transform: scale(1); }
    }

    /* ---------- Tasks ---------- */

    .tasks-card {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 260px;
    }

    .tasks-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .tasks-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .tasks-count {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .add-form {
      display: flex;
      gap: 9px;
    }

    .task-input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: rgba(9, 10, 15, 0.7);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .task-input::placeholder {
      color: var(--faint);
    }

    .task-input:focus {
      outline: none;
      border-color: rgba(255, 130, 105, 0.55);
      box-shadow: 0 0 0 3px rgba(255, 107, 94, 0.13);
    }

    .btn-add {
      display: grid;
      flex: none;
      place-items: center;
      width: 46px;
      height: 46px;
      font: inherit;
      font-size: 22px;
      font-weight: 500;
      color: #1a0d09;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent) 60%, var(--accent-alt));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 13px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .btn-add:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn-add:active {
      transform: scale(0.96);
    }

    .btn-add:focus-visible {
      outline: 2px solid #ffb39d;
      outline-offset: 3px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-right: 2px;
      max-height: 300px;
      overflow-y: auto;
      list-style: none;
    }

    .task-list::-webkit-scrollbar {
      width: 6px;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 13px;
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 13px;
      animation: taskIn 0.3s ease both;
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    @keyframes taskIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check {
      position: relative;
      display: grid;
      flex: none;
      place-items: center;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      cursor: pointer;
    }

    .check input {
      position: absolute;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .checkbox-visual {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1.5px solid #3a4155;
      border-radius: 6px;
      background: transparent;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .checkbox-visual::after {
      content: "";
      width: 9px;
      height: 5px;
      margin-top: -2px;
      border-bottom: 2px solid #1a0d09;
      border-left: 2px solid #1a0d09;
      transform: rotate(-45deg) scale(0);
      transition: transform 0.18s ease;
    }

    .check input:checked + .checkbox-visual {
      background: linear-gradient(135deg, var(--accent-soft), var(--accent) 60%, var(--accent-alt));
      border-color: transparent;
    }

    .check input:checked + .checkbox-visual::after {
      transform: rotate(-45deg) scale(1);
    }

    .check input:focus-visible + .checkbox-visual {
      box-shadow: 0 0 0 3px rgba(255, 107, 94, 0.2);
    }

    .task-text {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      transition: color 0.2s ease;
    }

    .task-item.done .task-text {
      color: #6b7184;
      text-decoration: line-through;
      text-decoration-color: rgba(255, 255, 255, 0.25);
    }

    .task-delete {
      display: grid;
      flex: none;
      place-items: center;
      width: 24px;
      height: 24px;
      font: inherit;
      font-size: 17px;
      line-height: 1;
      color: #6b7184;
      background: transparent;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .task-item:hover .task-delete,
    .task-delete:focus-visible {
      opacity: 1;
    }

    .task-delete:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #ff8a7a;
    }

    .task-delete:focus-visible {
      outline: 2px solid rgba(255, 179, 157, 0.7);
      outline-offset: 1px;
    }

    .empty-state {
      margin-top: 18px;
      padding: 18px;
      font-size: 13px;
      color: var(--faint);
      text-align: center;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }

    .empty-state[hidden] {
      display: none;
    }

    /* ---------- Toast ---------- */

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 50;
      padding: 12px 20px;
      font-size: 13.5px;
      color: var(--text);
      background: rgba(22, 24, 33, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ---------- Responsive ---------- */

    @media (max-width: 840px) {
      .app {
        padding: 28px 18px 44px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .timer-card {
        padding: 30px 22px;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 22px;
        border-radius: 22px;
      }

      .timer-wrap {
        width: min(290px, 78vw);
      }

      .stat-card {
        padding: 20px 22px;
      }

      .stat-number {
        font-size: 32px;
      }

      .dot {
        width: 8px;
        height: 8px;
      }

      .task-delete {
        opacity: 0.6;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        Pomodoro
      </div>
      <p class="date" id="today"></p>
    </header>

    <div class="grid">
      <section class="card timer-card" id="timerCard" aria-label="Pomodoro timer">
        <span class="mode-label">Focus session</span>

        <div class="timer-wrap">
          <svg class="ring" viewBox="0 0 320 320" aria-hidden="true">
            <defs>
              <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffa270"></stop>
                <stop offset="55%" stop-color="#ff6b5e"></stop>
                <stop offset="100%" stop-color="#ff4d8d"></stop>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="160" cy="160" r="140"></circle>
            <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="140" transform="rotate(-90 160 160)"></circle>
          </svg>

          <div class="timer-face">
            <span id="time" role="timer" aria-label="Time remaining">25:00</span>
            <span class="time-caption" id="timeCaption">remaining</span>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-start" id="startBtn" type="button">Start</button>
          <button class="btn btn-reset" id="resetBtn" type="button">Reset</button>
        </div>

        <p class="hint">Press <kbd>Space</kbd> to start or pause</p>
      </section>

      <aside class="side">
        <section class="card stat-card" aria-labelledby="sessionLabel">
          <div>
            <p class="stat-label" id="sessionLabel">Sessions today</p>
            <div class="stat-value-row">
              <span class="stat-number" id="sessionCount">0</span>
              <span class="stat-suffix">completed</span>
            </div>
          </div>
          <div class="dot-grid" id="dots" aria-hidden="true"></div>
        </section>

        <section class="card tasks-card" aria-labelledby="tasksTitle">
          <div class="tasks-head">
            <h2 class="tasks-title" id="tasksTitle">Today's tasks</h2>
            <span class="tasks-count" id="tasksCount" aria-live="polite"></span>
          </div>

          <form class="add-form" id="taskForm">
            <input
              class="task-input"
              id="taskInput"
              type="text"
              placeholder="Add a task for this session..."
              autocomplete="off"
              maxlength="160"
              aria-label="New task"
            >
            <button class="btn-add" type="submit" aria-label="Add task">+</button>
          </form>

          <ul class="task-list" id="taskList"></ul>
          <p class="empty-state" id="emptyState">Nothing here yet. Add your first task to stay focused.</p>
        </section>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const DURATION_MS = 25 * 60 * 1000;
      const MAX_DOTS = 8;
      const SESSION_KEY = 'pomodoro.sessions.v1';
      const TASK_KEY = 'pomodoro.tasks.v1';

      const timeEl = document.getElementById('time');
      const captionEl = document.getElementById('timeCaption');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const timerCard = document.getElementById('timerCard');
      const ringProgress = document.getElementById('ringProgress');
      const sessionCountEl = document.getElementById('sessionCount');
      const dotsEl = document.getElementById('dots');
      const taskForm = document.getElementById('taskForm');
      const taskInput = document.getElementById('taskInput');
      const taskListEl = document.getElementById('taskList');
      const tasksCountEl = document.getElementById('tasksCount');
      const emptyStateEl = document.getElementById('emptyState');
      const toastEl = document.getElementById('toast');

      const RADIUS = Number(ringProgress.getAttribute('r'));
      const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
      ringProgress.style.strokeDasharray = CIRCUMFERENCE + ' ' + CIRCUMFERENCE;

      let remainingMs = DURATION_MS;
      let endAt = 0;
      let tickHandle = null;
      let running = false;
      let finishing = false;
      let sessionCount = 0;
      let tasks = [];
      let audioCtx = null;
      let toastTimer = null;

      /* ---------- Helpers ---------- */

      function uid() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
      }

      function todayKey() {
        const d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      }

      function formatTime(ms) {
        const totalSeconds = Math.ceil(Math.max(0, ms) / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }

      /* ---------- Timer ---------- */

      function renderTimer() {
        const fraction = Math.min(1, Math.max(0, remainingMs / DURATION_MS));
        const label = formatTime(remainingMs);
        timeEl.textContent = label;
        ringProgress.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - fraction));
        document.title = label + ' \u00b7 Pomodoro';
      }

      function setRunningUi() {
        startBtn.textContent = running ? 'Pause' : 'Start';
        startBtn.classList.toggle('is-running', running);
      }

      function startTimer() {
        if (running || finishing) return;
        if (remainingMs <= 0) remainingMs = DURATION_MS;
        ensureAudio();
        running = true;
        endAt = Date.now() + remainingMs;
        captionEl.textContent = 'remaining';
        setRunningUi();
        renderTimer();
        tickHandle = window.setInterval(tick, 200);
      }

      function pauseTimer() {
        if (!running) return;
        remainingMs = Math.max(0, endAt - Date.now());
        running = false;
        window.clearInterval(tickHandle);
        tickHandle = null;
        setRunningUi();
        renderTimer();
      }

      function toggleTimer() {
        if (finishing) return;
        if (running) pauseTimer();
        else startTimer();
      }

      function resetTimer() {
        if (finishing) return;
        if (running) {
          running = false;
          window.clearInterval(tickHandle);
          tickHandle = null;
          setRunningUi();
        }
        remainingMs = DURATION_MS;
        captionEl.textContent = 'remaining';
        renderTimer();
      }

      function tick() {
        if (!running) return;
        remainingMs = Math.max(0, endAt - Date.now());
        renderTimer();
        if (remainingMs === 0) finishSession();
      }

      function finishSession() {
        if (finishing) return;
        finishing = true;
        running = false;
        window.clearInterval(tickHandle);
        tickHandle = null;
        remainingMs = 0;
        renderTimer();
        captionEl.textContent = 'session complete';
        setRunningUi();
        startBtn.disabled = true;
        resetBtn.disabled = true;
        timerCard.classList.add('complete');
        ensureAudio();
        playChime();
        addCompletedSession();
        showToast('Session complete \u2014 take a short break.');
        window.setTimeout(() => {
          finishing = false;
          remainingMs = DURATION_MS;
          captionEl.textContent = 'remaining';
          timerCard.classList.remove('complete');
          startBtn.disabled = false;
          resetBtn.disabled = false;
          renderTimer();
        }, 1800);
      }

      /* ---------- Sessions ---------- */

      function loadSessionCount() {
        try {
          const stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
          if (stored && stored.date === todayKey() && Number.isFinite(stored.count)) {
            return Math.max(0, Math.floor(stored.count));
          }
        } catch (err) {
          /* storage unavailable */
        }
        return 0;
      }

      function saveSessionCount() {
        try {
          localStorage.setItem(SESSION_KEY, JSON.stringify({ date: todayKey(), count: sessionCount }));
        } catch (err) {
          /* storage unavailable */
        }
      }

      function addCompletedSession() {
        sessionCount += 1;
        saveSessionCount();
        renderSessions(true);
      }

      function renderSessions(animate) {
        sessionCountEl.textContent = String(sessionCount);
        if (animate) {
          sessionCountEl.classList.remove('pop');
          void sessionCountEl.offsetWidth;
          sessionCountEl.classList.add('pop');
        }
        const filled = Math.min(sessionCount, MAX_DOTS);
        dotsEl.replaceChildren();
        for (let i = 0; i < MAX_DOTS; i += 1) {
          const dot = document.createElement('span');
          dot.className = i < filled ? 'dot filled' : 'dot';
          dotsEl.appendChild(dot);
        }
      }

      /* ---------- Tasks ---------- */

      function loadTasks() {
        try {
          const stored = JSON.parse(localStorage.getItem(TASK_KEY) || '[]');
          if (Array.isArray(stored)) {
            return stored
              .filter((item) => item && typeof item.text === 'string' && item.text.trim())
              .map((item) => ({
                id: typeof item.id === 'string' ? item.id : uid(),
                text: String(item.text).slice(0, 160),
                done: Boolean(item.done)
              }));
          }
        } catch (err) {
          /* storage unavailable */
        }
        return [];
      }

      function saveTasks() {
        try {
          localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
        } catch (err) {
          /* storage unavailable */
        }
      }

      function updateTasksMeta() {
        const done = tasks.filter((task) => task.done).length;
        tasksCountEl.textContent = tasks.length ? done + '/' + tasks.length + ' done' : '';
        emptyStateEl.hidden = tasks.length > 0;
      }

      function renderTasks() {
        taskListEl.replaceChildren();

        tasks.forEach((task) => {
          const item = document.createElement('li');
          item.className = task.done ? 'task-item done' : 'task-item';
          item.dataset.id = task.id;

          const check = document.createElement('label');
          check.className = 'check';

          const input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = task.done;
          input.setAttribute('aria-label', 'Mark "' + task.text + '" as complete');

          const visual = document.createElement('span');
          visual.className = 'checkbox-visual';
          visual.setAttribute('aria-hidden', 'true');

          check.append(input, visual);

          const text = document.createElement('span');
          text.className = 'task-text';
          text.textContent = task.text;

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'task-delete';
          remove.textContent = '\u00d7';
          remove.setAttribute('aria-label', 'Delete "' + task.text + '"');

          item.append(check, text, remove);
          taskListEl.appendChild(item);
        });

        updateTasksMeta();
      }

      taskForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = taskInput.value.trim();
        if (!value) {
          taskInput.focus();
          return;
        }
        tasks.push({ id: uid(), text: value.slice(0, 160), done: false });
        saveTasks();
        taskInput.value = '';
        renderTasks();
        taskInput.focus();
      });

      taskListEl.addEventListener('change', (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.type !== 'checkbox') return;
        const item = input.closest('.task-item');
        if (!item) return;
        const task = tasks.find((entry) => entry.id === item.dataset.id);
        if (!task) return;
        task.done = input.checked;
        item.classList.toggle('done', task.done);
        saveTasks();
        updateTasksMeta();
      });

      taskListEl.addEventListener('click', (event) => {
        const button = event.target.closest('.task-delete');
        if (!button) return;
        const item = button.closest('.task-item');
        if (!item) return;
        tasks = tasks.filter((entry) => entry.id !== item.dataset.id);
        saveTasks();
        renderTasks();
      });

      /* ---------- Audio ---------- */

      function ensureAudio() {
        if (!audioCtx) {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (AudioCtor) audioCtx = new AudioCtor();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      }

      function playChime() {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const start = audioCtx.currentTime;
        [523.25, 659.25, 783.99].forEach((frequency, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const at = start + index * 0.16;
          osc.type = 'sine';
          osc.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, at);
          gain.gain.exponentialRampToValueAtTime(0.16, at + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(at);
          osc.stop(at + 0.6);
        });
      }

      /* ---------- Toast ---------- */

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toastEl.classList.remove('show'), 3000);
      }

      /* ---------- Events ---------- */

      startBtn.addEventListener('click', toggleTimer);
      resetBtn.addEventListener('click', resetTimer);

      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' && event.key !== ' ') return;
        const target = event.target;
        if (target instanceof Element && target.closest('input, textarea, button, select, [contenteditable="true"]')) {
          return;
        }
        event.preventDefault();
        toggleTimer();
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && running) tick();
      });

      /* ---------- Init ---------- */

      document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'short',
        day: 'numeric'
      });

      sessionCount = loadSessionCount();
      tasks = loadTasks();
      renderSessions(false);
      renderTasks();
      renderTimer();
    })();
  </script>
</body>
</html>
